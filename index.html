<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smetannik the game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .btn-pulse:hover {
            transform: scale(1.05);
            transition: transform 0.2s;
        }
        input[type=range] {
            accent-color: #3b82f6;
        }
        
        /* Мемная тряска и пульсация для 67 */
        @keyframes memeShake {
            0% { transform: translate(2px, 1px) rotate(0deg) scale(1); }
            10% { transform: translate(-1px, -2px) rotate(-3deg) scale(1.1); }
            20% { transform: translate(-3px, 0px) rotate(3deg) scale(1.2); }
            30% { transform: translate(0px, 2px) rotate(0deg) scale(1.3); }
            40% { transform: translate(1px, -1px) rotate(3deg) scale(1.4); }
            50% { transform: translate(-1px, 2px) rotate(-3deg) scale(1.5); }
            60% { transform: translate(-3px, 1px) rotate(0deg) scale(1.4); }
            70% { transform: translate(2px, 1px) rotate(-3deg) scale(1.3); }
            80% { transform: translate(-1px, -1px) rotate(3deg) scale(1.2); }
            90% { transform: translate(2px, 2px) rotate(0deg) scale(1.1); }
            100% { transform: translate(1px, -2px) rotate(-3deg) scale(1); }
        }
        .meme-67 {
            display: inline-block; /* Необходимо для работы transform */
            animation: memeShake 0.4s infinite;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- UI: HUD (Счетчики, Жизни, Пауза) -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start hidden z-10 pointer-events-none">
        <div class="flex flex-col gap-2">
            <div class="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-2xl border border-white/20 backdrop-blur-sm shadow-lg">
                <img src="smetannik.png" class="w-6 h-6 object-contain" alt="С" onerror="this.style.display='none'">
                <span id="smetannikCount" class="text-white font-bold text-xl">0</span>
            </div>
            <div class="flex items-center gap-2 bg-black/60 px-3 py-1.5 rounded-2xl border border-white/20 backdrop-blur-sm shadow-lg">
                <img src="tomat.png" class="w-6 h-6 object-contain" alt="Т" onerror="this.style.display='none'">
                <span id="tomatCount" class="text-white font-bold text-xl">0</span>
            </div>
            <div class="text-red-500 text-2xl font-bold drop-shadow-md mt-1" id="livesDisplay">❤️❤️❤️</div>
        </div>
        <button id="btn-pause" class="pointer-events-auto bg-black/50 backdrop-blur-sm border-2 border-white/50 text-white p-2 rounded-full w-12 h-12 flex items-center justify-center font-bold text-xl active:bg-white/40 shadow-lg">
            ⏸
        </button>
    </div>

    <!-- Пасхалка 67 (без блюра и фона) -->
    <div id="meme67" class="absolute inset-0 flex justify-center items-center pointer-events-none hidden z-40">
        <h1 class="text-[120px] md:text-[180px] font-black text-transparent bg-clip-text bg-gradient-to-br from-purple-400 to-pink-600 drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] meme-67">
            67
        </h1>
    </div>

    <!-- Экран: Главное Меню -->
    <div id="screen-menu" class="absolute inset-0 flex flex-col justify-center items-center bg-black/80 z-20 transition-opacity duration-300">
        
        <button id="btn-nasevich" class="absolute top-4 right-4 text-[9px] font-bold text-white/30 hover:text-white transition-colors z-50 p-2 tracking-widest cursor-pointer">
            ВКЛЮЧИТЬ НАСЕВИЧА
        </button>

        <h1 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-br from-yellow-300 to-orange-500 mb-2 text-center drop-shadow-lg leading-tight uppercase tracking-wider">
            Smetannik<br>The Game
        </h1>
        <p class="text-white/70 font-bold mb-8 text-xl bg-black/50 px-4 py-1 rounded-full border border-white/10">Рекорд: <span id="highScoreDisplay" class="text-yellow-400">0</span></p>

        <div class="flex flex-col gap-4 w-3/4 max-w-[280px]">
            <button id="btn-play" class="btn-pulse bg-gradient-to-r from-green-400 to-green-600 text-white font-bold py-4 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1">
                ИГРАТЬ
            </button>
            <button id="btn-skins" class="btn-pulse bg-purple-600 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-purple-800 active:border-b-0 active:translate-y-1">
                СКИНЫ
            </button>
            <button id="btn-settings" class="btn-pulse bg-gray-700 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-gray-900 active:border-b-0 active:translate-y-1">
                НАСТРОЙКИ
            </button>
        </div>
    </div>

    <!-- Экран: Скины -->
    <div id="screen-skins" class="absolute inset-0 flex flex-col justify-center items-center bg-black/80 z-50 hidden transition-opacity duration-300">
        <h3 class="text-3xl font-black text-white mb-8">ВЫБОР СКИНА</h3>
        <div class="flex gap-4 mb-10 overflow-x-auto p-4 max-w-full">
            <div class="skin-card bg-gray-800 border-4 border-yellow-400 p-2 rounded-2xl cursor-pointer" data-skin="elisei.png">
                <div class="w-24 h-24 bg-gray-700 rounded-xl flex items-center justify-center overflow-hidden mb-2">
                    <img src="elisei.png" class="h-full object-contain" alt="Елисей">
                </div>
                <p class="text-white text-center font-bold">Елисей</p>
            </div>
            <div class="skin-card bg-gray-800 border-4 border-transparent p-2 rounded-2xl cursor-pointer" data-skin="greben.png">
                <div class="w-24 h-24 bg-gray-700 rounded-xl flex items-center justify-center overflow-hidden mb-2">
                    <img src="greben.png" onerror="this.src='greben.jpg'" class="h-full object-contain" alt="Ортём">
                </div>
                <p class="text-white text-center font-bold">Ортём</p>
            </div>
            <div class="skin-card bg-gray-800 border-4 border-transparent p-2 rounded-2xl cursor-pointer" data-skin="slavyan.png">
                <div class="w-24 h-24 bg-gray-700 rounded-xl flex items-center justify-center overflow-hidden mb-2">
                    <img src="slavyan.png" class="h-full object-contain" alt="Славян">
                </div>
                <p class="text-white text-center font-bold">Славян</p>
            </div>
        </div>
        <button id="btn-close-skins" class="bg-blue-500 w-3/4 max-w-[250px] text-white font-bold py-4 rounded-xl shadow border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">
            НАЗАД
        </button>
    </div>

    <!-- Экран: Настройки -->
    <div id="screen-settings" class="absolute inset-0 flex justify-center items-center bg-black/80 z-50 hidden backdrop-blur-sm">
        <div class="bg-gray-900 p-6 rounded-3xl w-4/5 max-w-[300px] text-center shadow-2xl border-2 border-gray-700">
            <h3 class="text-2xl font-black text-white mb-6">НАСТРОЙКИ</h3>
            <div class="mb-4 text-left">
                <label class="text-gray-300 font-bold mb-2 block">Музыка</label>
                <input type="range" id="volMusic" min="0" max="1" step="0.1" value="0.5" class="w-full">
            </div>
            <div class="mb-8 text-left">
                <label class="text-gray-300 font-bold mb-2 block">Звуки (Эффекты)</label>
                <input type="range" id="volSfx" min="0" max="1" step="0.1" value="1" class="w-full">
            </div>
            <button id="btn-close-settings" class="bg-blue-500 w-full text-white font-bold py-3 rounded-xl shadow border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">
                ГОТОВО
            </button>
        </div>
    </div>

    <!-- Экран: Пауза -->
    <div id="screen-pause" class="absolute inset-0 flex flex-col justify-center items-center bg-black/70 z-30 hidden backdrop-blur-sm">
        <h2 class="text-4xl font-black text-white mb-6 drop-shadow-lg">ПАУЗА</h2>
        
        <div class="w-3/4 max-w-[280px] bg-black/50 p-4 rounded-2xl border border-white/20 mb-6 shadow-lg">
            <label class="text-gray-300 font-bold mb-1 block text-sm">Музыка</label>
            <input type="range" id="volMusicPause" min="0" max="1" step="0.1" value="0.5" class="w-full mb-3">
            <label class="text-gray-300 font-bold mb-1 block text-sm">Звуки</label>
            <input type="range" id="volSfxPause" min="0" max="1" step="0.1" value="1" class="w-full">
        </div>

        <div class="flex flex-col gap-4 w-3/4 max-w-[250px]">
            <button id="btn-resume" class="btn-pulse bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg border-b-4 border-blue-700 active:border-b-0 active:translate-y-1">
                ПРОДОЛЖИТЬ
            </button>
            <button id="btn-quit" class="btn-pulse bg-red-500 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-red-700 active:border-b-0 active:translate-y-1">
                В МЕНЮ
            </button>
        </div>
    </div>

    <!-- Экран: Game Over -->
    <div id="screen-gameover" class="absolute inset-0 flex flex-col justify-center items-center bg-black/90 z-30 hidden">
        <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-lg uppercase">Игра окончена!</h2>
        <p class="text-white text-xl mb-8">Собрано сметанников: <span id="finalScore" class="font-bold text-yellow-400 text-3xl block mt-2">0</span></p>
        <div class="flex flex-col gap-4 w-3/4 max-w-[250px]">
            <button id="btn-restart" class="btn-pulse bg-green-500 text-white font-bold py-4 rounded-2xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1">
                ИГРАТЬ СНОВА
            </button>
            <button id="btn-menu-from-go" class="btn-pulse bg-gray-600 text-white font-bold py-3 rounded-2xl shadow-lg border-b-4 border-gray-800 active:border-b-0 active:translate-y-1">
                В ГЛАВНОЕ МЕНЮ
            </button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    // Функция переключения экранов (мем 67 теперь не затрагивается, интерфейс не ломается)
    function showScreen(screenKey) {
        const allScreenIds = ['screen-menu', 'hud', 'screen-skins', 'screen-settings', 'screen-pause', 'screen-gameover'];
        allScreenIds.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        });
        
        const map = {
            'menu': 'screen-menu',
            'hud': 'hud',
            'skins': 'screen-skins',
            'settings': 'screen-settings',
            'pause': 'screen-pause',
            'gameOver': 'screen-gameover'
        };
        
        if (map[screenKey]) {
            document.getElementById(map[screenKey]).classList.remove('hidden');
        }
    }

    // --- РЕКОРД ---
    let highScore = localStorage.getItem('smetannikHighScore') || 0;
    document.getElementById('highScoreDisplay').innerText = highScore;

    // --- ЗВУКИ ---
    const audioMusic = new Audio('music.mp3');
    audioMusic.loop = true;

    const audioSfx = {
        brosok: 'brosok.mp3',
        error: 'error.mp3',
        over: 'over.mp3',
        maslina: 'maslina.mp3'
    };

    let volSettings = { music: 0.5, sfx: 1.0 };
    const els = {
        m: document.getElementById('volMusic'),
        s: document.getElementById('volSfx'),
        mp: document.getElementById('volMusicPause'),
        sp: document.getElementById('volSfxPause')
    };

    function updateVolumes(source) {
        if(source === 'main') {
            volSettings.music = parseFloat(els.m.value);
            volSettings.sfx = parseFloat(els.s.value);
            els.mp.value = volSettings.music;
            els.sp.value = volSettings.sfx;
        } else {
            volSettings.music = parseFloat(els.mp.value);
            volSettings.sfx = parseFloat(els.sp.value);
            els.m.value = volSettings.music;
            els.s.value = volSettings.sfx;
        }
        audioMusic.volume = volSettings.music;
    }
    
    els.m.addEventListener('input', () => updateVolumes('main'));
    els.s.addEventListener('input', () => updateVolumes('main'));
    els.mp.addEventListener('input', () => updateVolumes('pause'));
    els.sp.addEventListener('input', () => updateVolumes('pause'));
    updateVolumes('main');

    function playSfx(key) {
        if(volSettings.sfx > 0) {
            let snd = new Audio(audioSfx[key]);
            snd.volume = volSettings.sfx;
            snd.play().catch(()=>{});
        }
    }

    function vibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    // --- ИГРОВЫЕ ПЕРЕМЕННЫЕ ---
    let gameLoopId;
    let isPlaying = false;
    let isPaused = false;
    
    let collectedSmetanniks = 0;
    let collectedTomatoes = 0;
    let lives = 3;
    let frameCount = 0;
    let lastOliveFrame = 0;
    let meme67Shown = false;
    
    const player = { w: 0, h: 0, x: 0, y: 0 };
    let items = [];
    let particles = [];

    // --- ГРАФИКА И СКИНЫ ---
    const assets = {
        bgMobile: { img: new Image(), loaded: false },
        bgPc: { img: new Image(), loaded: false },
        nasevich: { img: new Image(), loaded: false },
        player: { img: new Image(), loaded: false },
        smetannik: { img: new Image(), loaded: false },
        tomat: { img: new Image(), loaded: false },
        olive: { img: new Image(), loaded: false }
    };
    
    assets.bgMobile.img.src = 'stolovka.jpg';
    assets.bgMobile.img.onload = () => assets.bgMobile.loaded = true;
    assets.bgPc.img.src = 'stolovkapc.jpg';
    assets.bgPc.img.onload = () => assets.bgPc.loaded = true;

    assets.nasevich.img.src = 'nasevich.jpg';
    assets.nasevich.img.onload = () => assets.nasevich.loaded = true;

    let currentSkin = 'elisei.png';
    function loadSkin(filename) {
        assets.player.loaded = false;
        assets.player.img.src = filename;
        assets.player.img.onerror = () => {
            if(filename === 'greben.png') assets.player.img.src = 'greben.jpg';
        };
        assets.player.img.onload = () => {
            assets.player.loaded = true;
            resizeCanvas(); 
            // Принудительно рисуем фон после изменения размера, чтобы не было черного экрана в меню
            if (!isPlaying) draw(); 
        };
    }
    loadSkin(currentSkin);

    document.querySelectorAll('.skin-card').forEach(card => {
        card.addEventListener('click', function() {
            document.querySelectorAll('.skin-card').forEach(c => c.classList.replace('border-yellow-400', 'border-transparent'));
            this.classList.replace('border-transparent', 'border-yellow-400');
            currentSkin = this.getAttribute('data-skin');
            loadSkin(currentSkin);
        });
    });

    assets.smetannik.img.src = 'smetannik.png';
    assets.smetannik.img.onload = () => assets.smetannik.loaded = true;
    assets.tomat.img.src = 'tomat.png';
    assets.tomat.img.onload = () => assets.tomat.loaded = true;
    assets.olive.img.src = 'olive.png';
    assets.olive.img.onload = () => assets.olive.loaded = true;

    let nasevichMode = false;
    const btnNasevich = document.getElementById('btn-nasevich');
    btnNasevich.addEventListener('click', () => {
        nasevichMode = !nasevichMode;
        btnNasevich.innerText = nasevichMode ? "ВЫКЛЮЧИТЬ НАСЕВИЧА" : "ВКЛЮЧИТЬ НАСЕВИЧА";
        if(nasevichMode) btnNasevich.classList.replace('text-white/30', 'text-yellow-400');
        else btnNasevich.classList.replace('text-yellow-400', 'text-white/30');
        draw(); 
    });

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        player.h = Math.min(250, canvas.height * 0.22);
        
        if (assets.player.loaded && assets.player.img.height) {
            player.w = player.h * (assets.player.img.width / assets.player.img.height);
        } else {
            player.w = player.h * 0.8;
        }

        if (!isPlaying && !isPaused) {
            player.x = canvas.width / 2 - player.w / 2;
        }
        player.y = canvas.height - player.h - 10;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let targetX = canvas.width / 2;
    function handleMove(e) {
        if (!isPlaying || isPaused) return;
        let clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
        const rect = canvas.getBoundingClientRect();
        targetX = clientX - rect.left;
    }
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('touchmove', (e) => { if(e.cancelable) e.preventDefault(); handleMove(e); }, { passive: false });
    canvas.addEventListener('mousedown', handleMove);
    canvas.addEventListener('touchstart', handleMove, { passive: false });

    function spawnParticles(x, y, type) {
        let color = '#fef08a';
        if (type === 'tomat') color = '#ef4444';
        if (type === 'olive') color = '#111827'; 
        
        for(let i=0; i<15; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() * -8) - 2,
                life: 1.0,
                color: color
            });
        }
    }

    function initGame() {
        collectedSmetanniks = 0;
        collectedTomatoes = 0;
        lives = 3;
        items = [];
        particles = [];
        frameCount = 0;
        lastOliveFrame = 0;
        meme67Shown = false;
        player.x = canvas.width / 2 - player.w / 2;
        targetX = player.x + player.w/2;
        updateHUD();
    }

    function spawnItem() {
        const baseSpeed = 2.5 + (collectedSmetanniks / 40); 
        const size = Math.min(60, canvas.width * 0.15);
        
        let type = 'smetannik';
        let r = Math.random();
        
        if (r > 0.95 && frameCount - lastOliveFrame > 400) {
            type = 'olive';
            lastOliveFrame = frameCount;
        } else if (r > 0.80) {
            type = 'tomat';
        }
        
        let newX = 0;
        let isValidPosition = false;

        for (let attempt = 0; attempt < 10; attempt++) {
            newX = Math.random() * (canvas.width - size);
            isValidPosition = true;
            for (let item of items) {
                if (item.y < size * 3 && Math.abs(item.x - newX) < size * 1.5) {
                    isValidPosition = false;
                    break;
                }
            }
            if (isValidPosition) break; 
        }

        let itemW = size;
        let itemH = size;
        if (type === 'olive' && assets.olive.loaded && assets.olive.img.width) {
            let aspect = assets.olive.img.width / assets.olive.img.height;
            itemH = itemW / aspect; 
        }

        items.push({
            x: newX, y: -itemH,
            w: itemW, h: itemH,
            speed: baseSpeed + (Math.random() * 1.5),
            type: type
        });
    }

    // Независимая функция запуска мема
    function triggerMeme67() {
        const memeEl = document.getElementById('meme67');
        memeEl.classList.remove('hidden');
        setTimeout(() => {
            memeEl.classList.add('hidden');
        }, 2000);
    }

    function update() {
        if (!isPlaying || isPaused) return;
        frameCount++;

        player.x += (targetX - player.w / 2 - player.x) * 0.3;

        const spawnRate = Math.max(35, 100 - Math.floor(collectedSmetanniks / 3));
        if (frameCount % spawnRate === 0) spawnItem();

        if (collectedSmetanniks === 67 && !meme67Shown) {
            meme67Shown = true;
            triggerMeme67();
        }

        const hitX = player.x + (player.w * 0.3);
        const hitW = player.w * 0.4;
        const hitY = player.y + (player.h * 0.1);
        const hitH = player.h * 0.9;

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i];
            item.y += item.speed;

            if (
                item.x < hitX + hitW &&
                item.x + item.w > hitX &&
                item.y < hitY + hitH &&
                item.y + item.h > hitY
            ) {
                if (item.type === 'smetannik') {
                    collectedSmetanniks++;
                } else if (item.type === 'olive') {
                    lives++;
                    playSfx('maslina');
                    vibrate([100, 50, 100]);
                    spawnParticles(item.x + item.w/2, item.y + item.h/2, 'olive');
                } else {
                    collectedTomatoes++;
                    lives--;
                    playSfx('brosok'); 
                    vibrate(100); 
                    spawnParticles(item.x + item.w/2, item.y + item.h/2, 'tomat');
                }
                items.splice(i, 1);
                updateHUD();
                if (lives <= 0) { gameOver(); return; }
                continue;
            }

            if (item.y > canvas.height) {
                if (item.type === 'smetannik') {
                    lives--;
                    playSfx('error');
                    vibrate([50, 50, 50]); 
                    spawnParticles(item.x + item.w/2, canvas.height, 'smetannik');
                } else {
                    spawnParticles(item.x + item.w/2, canvas.height, item.type);
                }
                items.splice(i, 1);
                updateHUD();
                if (lives <= 0) { gameOver(); return; }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.4;
            p.life -= 0.03;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let activeBg = (canvas.width > 768 && assets.bgPc.loaded) ? assets.bgPc : assets.bgMobile;

        if (nasevichMode && assets.nasevich.loaded) {
            ctx.drawImage(assets.nasevich.img, 0, 0, canvas.width, canvas.height);
        } else if (activeBg.loaded) {
            ctx.drawImage(activeBg.img, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
        ctx.shadowBlur = 10;
        if (assets.player.loaded) {
            ctx.drawImage(assets.player.img, player.x, player.y, player.w, player.h);
        } else {
            ctx.fillStyle = '#3182ce';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
        ctx.restore();

        for (let item of items) {
            ctx.save();
            if (item.type === 'smetannik') {
                ctx.shadowColor = 'rgba(252, 211, 77, 0.8)';
                ctx.shadowBlur = 15;
                if (assets.smetannik.loaded) ctx.drawImage(assets.smetannik.img, item.x, item.y, item.w, item.h);
            } else if (item.type === 'olive') {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                ctx.shadowBlur = 15;
                if (assets.olive.loaded) ctx.drawImage(assets.olive.img, item.x, item.y, item.w, item.h);
            } else {
                ctx.shadowColor = 'rgba(239, 68, 68, 0.8)';
                ctx.shadowBlur = 15;
                if (assets.tomat.loaded) ctx.drawImage(assets.tomat.img, item.x, item.y, item.w, item.h);
            }
            ctx.restore();
        }

        for (let p of particles) {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
    }

    function loop() {
        update();
        draw();
        if (isPlaying) gameLoopId = requestAnimationFrame(loop);
    }

    function updateHUD() {
        document.getElementById('smetannikCount').innerText = collectedSmetanniks;
        document.getElementById('tomatCount').innerText = collectedTomatoes;
        document.getElementById('livesDisplay').innerText = '❤️'.repeat(Math.max(0, lives));
    }

    function startGame() {
        initGame();
        isPlaying = true;
        isPaused = false;
        showScreen('hud');
        if(volSettings.music > 0) audioMusic.play().catch(()=>{});
        loop();
    }

    function pauseGame() {
        if (!isPlaying || isPaused) return;
        isPaused = true;
        audioMusic.pause(); 
        showScreen('pause');
    }

    function resumeGame() {
        if (!isPlaying || !isPaused) return;
        isPaused = false;
        showScreen('hud');
        targetX = player.x + player.w/2;
        if(volSettings.music > 0) audioMusic.play().catch(()=>{});
    }

    function gameOver() {
        isPlaying = false;
        cancelAnimationFrame(gameLoopId);
        
        try {
            if (collectedSmetanniks > highScore) {
                highScore = collectedSmetanniks;
                localStorage.setItem('smetannikHighScore', highScore);
                document.getElementById('highScoreDisplay').innerText = highScore;
            }
        } catch(e) { } 

        document.getElementById('finalScore').innerText = collectedSmetanniks;
        
        audioMusic.pause();
        audioMusic.currentTime = 0;
        playSfx('over');
        
        showScreen('gameOver');
    }

    function quitToMenu() {
        isPlaying = false;
        isPaused = false;
        cancelAnimationFrame(gameLoopId);
        audioMusic.pause();
        audioMusic.currentTime = 0;
        initGame(); 
        draw(); 
        showScreen('menu'); 
    }

    // ПРИВЯЗКИ КНОПОК
    document.getElementById('btn-play').addEventListener('click', startGame);
    document.getElementById('btn-skins').addEventListener('click', () => showScreen('skins'));
    document.getElementById('btn-close-skins').addEventListener('click', () => { showScreen('menu'); draw(); });
    
    document.getElementById('btn-settings').addEventListener('click', () => showScreen('settings'));
    document.getElementById('btn-close-settings').addEventListener('click', () => showScreen('menu'));
    
    document.getElementById('btn-pause').addEventListener('click', pauseGame);
    document.getElementById('btn-resume').addEventListener('click', resumeGame);
    document.getElementById('btn-quit').addEventListener('click', quitToMenu);
    
    document.getElementById('btn-restart').addEventListener('click', startGame);
    document.getElementById('btn-menu-from-go').addEventListener('click', quitToMenu);

    initGame();
    setTimeout(draw, 300);
</script>
</body>
</html>
